name: Build iOS App

on:
  push:
    branches: [ main, build-ios ]
  workflow_dispatch:

# GitHub Actions already skips workflows when the commit message contains
# [skip ci], [ci skip], [no ci], [skip actions], or [actions skip].
# The job-level `if` below is an explicit, belt-and-suspenders guard.
jobs:
  build:
    name: Build electerm iOS
    runs-on: macos-latest
    timeout-minutes: 120
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[no ci]') && !contains(github.event.head_commit.message, '[skip actions]') && !contains(github.event.head_commit.message, '[actions skip]') }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Accept Xcode license
        run: sudo xcodebuild -license accept || true

      - name: Ensure CocoaPods is available
        run: which pod >/dev/null 2>&1 || sudo gem install cocoapods

      - name: ci init
        run: npm config set legacy-peer-deps true

      - name: Install root dependencies (electerm + build tooling)
        run: npm i

      - name: Install Capacitor dependencies
        run: npm --prefix build/ios install

      - name: Build web frontend + Node.js backend bundle
        env:
          # JWT secret for the on-device electerm server. Optional — build.mjs
          # falls back to a random key when not provided. Set it for
          # reproducible production builds:
          #   gh secret set SERVER_SECRET --body "$(openssl rand -hex 32)"
          SERVER_SECRET: ${{ secrets.SERVER_SECRET }}
        run: npm run build:ios

      - name: Add iOS platform (first run only)
        run: cd build/ios && [ -d ios ] || npx cap add ios

      - name: Sync Capacitor (copies web assets + native plugins)
        run: cd build/ios && npx cap sync ios

      - name: Apply Info.plist overlay (ATS exception for localhost)
        run: cd build/ios && node build.mjs --overlay-only

      - name: Resolve Swift Package Manager dependencies
        run: |
          # Capacitor 8 uses SPM (not CocoaPods): the native project is an
          # .xcodeproj, not an .xcworkspace. Resolve packages explicitly so any
          # network/resolution error surfaces here with a clear log.
          cd build/ios/ios/App
          xcodebuild -project App.xcodeproj -resolvePackageDependencies \
            -configuration Release

      - name: Build iOS app (unsigned, device SDK)
        run: |
          # Capacitor scaffolds the native project at build/ios/ios/App/
          # (an .xcodeproj; the scheme is "App"). Building via the *scheme*
          # (not -target) is required so Xcode generates the
          # @capawesome/capacitor-nodejs SPM module map in the correct
          # dependency order before the App target's clang dependency scan.
          cd build/ios/ios/App
          xcodebuild -project App.xcodeproj -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build

      - name: Locate built .app and upload as artifact
        if: ${{ !cancelled() }}
        run: |
          APP=$(find ~/Library/Developer/Xcode/DerivedData -name 'App.app' -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            echo "Built app: $APP"
            du -sh "$APP"
            mkdir -p /tmp/ios-build
            cp -R "$APP" /tmp/ios-build/
            echo "app-path=$APP" >> "$GITHUB_ENV"
          else
            echo "No App.app found in DerivedData"
          fi

      - name: Upload built .app (unsigned, proof of build)
        if: ${{ !cancelled() && env.app-path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: electerm-ios-app-unsigned
          path: /tmp/ios-build/App.app
          if-no-files-found: warn
          retention-days: 7
